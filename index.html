<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt Chart - Duração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Gantt Chart</h1>
        <div class="header-controls">
            <label for="view-mode">Modo de Visualização:</label>
            <select id="view-mode">
                <option value="running_days">Dias Corridos</option>
                <option value="work_days">Dias Úteis</option>
            </select>
            <button id="toggle-critical-path">Caminho Crítico</button>
            <button id="theme-switcher">Mudar Tema</button>
        </div>
        <div class="header-actions">
            <button id="save-chart">Salvar</button>
            <button id="load-chart">Carregar</button>
            <button id="share-chart">Compartilhar</button>
            <button id="export-png">Exportar PNG</button>
            <button id="export-pdf">Exportar PDF</button>
            <button id="export-csv">Exportar CSV</button>
        </div>
    </header>

    <main class="main-container">
        <aside class="side-panel">
            <h2>Adicionar/Editar Tarefa</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-name">Nome da Tarefa</label>
                    <input type="text" id="task-name" required>
                </div>
                <div class="form-group">
                    <label for="task-description">Descrição</label>
                    <textarea id="task-description"></textarea>
                </div>
                <div class="form-group duration-group">
                    <label for="task-duration">Duração</label>
                    <input type="number" id="task-duration" min="1" value="1" required>
                    <select id="task-duration-unit">
                        <option value="hours">Horas</option>
                        <option value="running_days" selected>Dias Corridos</option>
                        <option value="work_days">Dias Úteis</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-dependencies">Dependências (ex: 1FS, 2SS)</label>
                    <input type="text" id="task-dependencies">
                </div>
                <div class="form-group">
                    <label for="task-progress">Progresso (%)</label>
                    <input type="number" id="task-progress" min="0" max="100" value="0">
                </div>
                <div class="form-group">
                    <label for="task-deadline">Prazo Final</label>
                    <input type="date" id="task-deadline">
                </div>
                <button type="submit" id="form-submit-button">Adicionar Tarefa</button>
            </form>
        </aside>
        <section class="gantt-chart-area">
            <div class="gantt-chart" id="gantt-chart">
                <!-- As tarefas do Gantt serão renderizadas aqui -->
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
